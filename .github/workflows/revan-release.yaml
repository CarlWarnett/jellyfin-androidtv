name: Jellyfin Clean / Release

# Push a tag like v0.1.0 to build a signed APK and publish it as a GitHub Release.
# Obtainium on the TV picks up each new release as an update.
on:
  push:
    tags:
      - v*

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'CarlWarnett' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set JELLYFIN_VERSION
        run: echo "JELLYFIN_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="jellyfin-clean-${GITHUB_REF_NAME}.apk"
          mv app/build/outputs/apk/release/jellyfin-androidtv-*-release.apk "$APK"
          # The release may already exist if it was created on github.com (which also creates the tag)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "Jellyfin Clean $GITHUB_REF_NAME" --generate-notes
          fi
