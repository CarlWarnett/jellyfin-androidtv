name: Jellyfin Clean / Release

# Every push to clean-ui builds a signed APK and publishes it as the next GitHub Release
# (v0.1.1, v0.1.2, ...). Obtainium on the TV picks up each new release as an update.
# A release created by hand on github.com (or a pushed v* tag) is built the same way.
on:
  push:
    branches:
      - clean-ui
    tags:
      - v*
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'CarlWarnett' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Next patch version after the highest vX.Y.Z release
            LAST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            LAST=${LAST:-v0.1.0}
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "JELLYFIN_VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "Releasing $TAG"

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > keystore.jks

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Publish GitHub release
        run: |
          APK="jellyfin-clean-${TAG}.apk"
          mv app/build/outputs/apk/release/jellyfin-androidtv-*-release.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            # Releases made with GITHUB_TOKEN don't trigger other workflow runs, so this doesn't loop
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Jellyfin Clean $TAG" --generate-notes
          fi
